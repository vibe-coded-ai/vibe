<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Tracker</title>
  <style>
    :root { --ink: #162033; --muted: #667085; --bg: #f4f7fb; --card: #fff; --accent: #3157d5; --line: #dce3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { width: min(920px, calc(100% - 32px)); margin: 48px auto; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); letter-spacing: -.05em; }
    header p { margin: 6px 0 0; color: var(--muted); }
    .filter { width: 160px; }
    .panel { padding: 20px; margin-bottom: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 15px; }
    form { display: grid; grid-template-columns: 1.4fr .75fr .75fr auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: .8rem; font-weight: 700; }
    input, select, textarea, button { border-radius: 8px; font: inherit; }
    input, select, textarea { width: 100%; padding: 10px 11px; color: var(--ink); background: white; border: 1px solid var(--line); }
    textarea { grid-column: 1 / -1; min-height: 72px; resize: vertical; }
    button { padding: 10px 14px; border: 0; color: white; background: var(--accent); font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .55; }
    #message { min-height: 1.4em; margin: 9px 0 0; color: var(--muted); }
    #items { display: grid; gap: 10px; }
    article { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 17px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; }
    h2 { margin: 0 0 4px; font-size: 1.05rem; }
    article p { margin: 8px 0 0; color: var(--muted); white-space: pre-wrap; }
    .badges { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: .78rem; }
    .badge { padding: 3px 8px; border-radius: 999px; background: #edf1ff; color: #2948ad; font-weight: 800; }
    .status-control { display: flex; gap: 7px; align-items: center; }
    .status-control select { min-width: 120px; }
    .status-control button { padding: 9px 11px; }
    .empty { color: var(--muted); text-align: center; padding: 28px; }
    @media (max-width: 720px) { main { margin: 28px auto; } header { align-items: start; flex-direction: column; } form { grid-template-columns: 1fr 1fr; } form label:first-child { grid-column: 1 / -1; } form button { grid-column: 1 / -1; } article { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Status tracker</h1><p>Keep the current state and context of every item in one queryable place.</p></div>
      <label class="filter">Show
        <select id="filter"><option value="">All statuses</option><option>open</option><option>in progress</option><option>blocked</option><option>done</option></select>
      </label>
    </header>
    <section class="panel">
      <form id="item-form">
        <label>Name <input name="name" placeholder="Ship the first draft" required></label>
        <label>Status <select name="status"><option>open</option><option>in progress</option><option>blocked</option><option>done</option></select></label>
        <label>Priority <select name="priority"><option>low</option><option selected>normal</option><option>high</option><option>urgent</option></select></label>
        <button type="submit">Add item</button>
        <label style="grid-column: 1 / -1">Notes <textarea name="notes" placeholder="What matters, what is blocked, and what happens next…"></textarea></label>
      </form>
      <p id="message" role="status"></p>
    </section>
    <section id="items"><p class="empty">Loading items…</p></section>
  </main>
  <script>
    const form = document.querySelector('#item-form');
    const itemsEl = document.querySelector('#items');
    const filterEl = document.querySelector('#filter');
    const messageEl = document.querySelector('#message');
    const statuses = ['open', 'in progress', 'blocked', 'done'];
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);

    async function callApi(name, args = {}) {
      const response = await fetch(`/api/${name}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args)
      });
      const result = await response.json();
      if (!response.ok || result.success === false) throw new Error(result.error || 'Request failed');
      return result.data;
    }

    function render(items) {
      if (!items.length) {
        itemsEl.innerHTML = '<p class="empty">No matching items.</p>';
        return;
      }
      itemsEl.innerHTML = items.map((item) => `
        <article>
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <div class="badges"><span class="badge">${escapeHtml(item.priority)}</span><span>${escapeHtml(item.status)}</span></div>
            ${item.notes ? `<p>${escapeHtml(item.notes)}</p>` : ''}
          </div>
          <div class="status-control">
            <select aria-label="New status" data-status-for="${item.id}">
              ${statuses.map((status) => `<option${item.status === status ? ' selected' : ''}>${status}</option>`).join('')}
            </select>
            <button type="button" data-update="${item.id}">Update</button>
          </div>
        </article>`).join('');
    }

    async function loadItems() {
      const status = filterEl.value || undefined;
      try { render(await callApi('list_items', { status })); }
      catch (error) { itemsEl.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`; }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      messageEl.textContent = 'Adding…';
      try {
        await callApi('add_item', Object.fromEntries(new FormData(form)));
        form.reset();
        messageEl.textContent = 'Item added.';
        await loadItems();
      } catch (error) {
        messageEl.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    itemsEl.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-update]');
      if (!button) return;
      const id = button.dataset.update;
      const status = itemsEl.querySelector(`[data-status-for="${id}"]`).value;
      button.disabled = true;
      try { await callApi('update_status', { id, status }); await loadItems(); }
      catch (error) { messageEl.textContent = error.message; button.disabled = false; }
    });
    filterEl.addEventListener('change', loadItems);
    loadItems();
  </script>
</body>
</html>
